name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # MLX needs Metal. If the hosted runner turns out not to provide a usable GPU, switch this to
    # a self-hosted Apple silicon Mac, which is what mlx-swift's own CI uses.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The suite that needs Meta's gated checkpoint skips itself; everything else runs offline
      # from the fixtures in Tests/MLXDINOv3Tests/Fixtures.
      - name: Build and test
        run: |
          xcodebuild test \
            -scheme MLXDINOv3-Package \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode
